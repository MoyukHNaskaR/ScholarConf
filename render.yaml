services:
  - type: web
    name: scholarconf-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: scholarconf.moyukh@gmail.com
      - key: SENDER_NAME
        value: ScholarConf
      - key: JWT_SECRET
        generateValue: true
